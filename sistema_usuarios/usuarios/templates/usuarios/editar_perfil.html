<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        
        .glow-card {
            background: #131b2e;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(79, 70, 229, 0.15);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        /* Estilos para adaptar el {{ form.as_p }} de Django al modo oscuro */
        form p {
            margin-bottom: 1.25rem;
        }

        form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
            text-transform: capitalize;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form select,
        form textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            color: #ffffff;
        }

        form .helptext {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        form .errorlist {
            list-style: none;
            padding: 0;
            margin: 0.25rem 0 0 0;
            color: #f87171;
            font-size: 0.8rem;
        }

        .btn-glow-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-glow-primary:hover {
            opacity: 0.9;
            color: white;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }

        .btn-glow-outline {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid #334155;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-glow-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: #64748b;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="glow-card p-4 p-md-5">
                    <!-- Cabecera -->
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                        <div class="header-icon">
                            <i class="bi bi-pencil-square"></i>
                        </div>
                        <div>
                            <h1 class="h4 mb-0 fw-bold text-white">Editar Perfil</h1>
                            <small class="text-white-50">Actualiza tus datos de usuario</small>
                        </div>
                    </div>

                    <!-- Formulario de Django -->
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <div class="d-flex align-items-center justify-content-between gap-3 pt-3 mt-4 border-top border-secondary border-opacity-25">
                            <a href="{% url 'bienvenida' %}" class="btn btn-glow-outline px-4">
                                <i class="bi bi-arrow-left me-1"></i> Volver
                            </a>

                            <button type="submit" class="btn btn-glow-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i> Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
