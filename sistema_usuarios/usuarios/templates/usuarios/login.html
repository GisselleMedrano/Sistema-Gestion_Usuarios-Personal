<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        
        .glow-card {
            background: #131b2e;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(79, 70, 229, 0.15);
        }

        .login-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Estilos para adaptar el {{ form.as_p }} de Django */
        form p {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            color: #ffffff;
        }

        form .helptext {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        form .errorlist {
            list-style: none;
            padding: 0;
            margin: 0.25rem 0 0 0;
            color: #f87171;
            font-size: 0.8rem;
        }

        .btn-glow-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-glow-primary:hover {
            opacity: 0.9;
            color: white;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }

        .link-register {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .link-register:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                
                <div class="glow-card p-4 p-md-5 text-center">
                    <!-- Icono de Cabecera -->
                    <div class="login-avatar">
                        <i class="bi bi-person-lock"></i>
                    </div>

                    <h1 class="h4 mb-1 fw-bold text-white">Iniciar sesión</h1>
                    <p class="text-white-50 small mb-4">Ingresa tus credenciales para acceder</p>

                    <!-- Formulario de Django -->
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-glow-primary w-100 mt-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <p class="mb-0 text-white-50 small">
                            ¿No tienes una cuenta? 
                            <a href="{% url 'registro' %}" class="link-register">Registrarse</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
