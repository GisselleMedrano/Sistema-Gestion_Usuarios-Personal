<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Cuenta</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        
        .glow-card-danger {
            background: #131b2e;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.15);
        }

        .danger-icon {
            width: 56px;
            height: 56px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem auto;
        }

        .btn-glow-danger {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-glow-danger:hover {
            opacity: 0.9;
            color: white;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }

        .btn-glow-outline {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid #334155;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-glow-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: #64748b;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                
                <div class="glow-card-danger p-4 p-md-5 text-center">
                    <!-- Icono de advertencia -->
                    <div class="danger-icon">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>

                    <h1 class="h4 mb-2 fw-bold text-white">Eliminar Cuenta</h1>
                    
                    <p class="fs-6 text-white-50 mb-1">
                        ¿Está seguro que desea eliminar su cuenta?
                    </p>
                    <p class="small text-danger fw-semibold mb-4">
                        <i class="bi bi-info-circle me-1"></i> Esta acción no se puede deshacer.
                    </p>

                    <!-- Acciones -->
                    <div class="d-flex flex-column gap-2 pt-2">
                        <form method="POST" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-glow-danger w-100 py-2">
                                <i class="bi bi-trash3-fill me-1"></i> Sí, eliminar mi cuenta
                            </button>
                        </form>

                        <a href="{% url 'bienvenida' %}" class="btn btn-glow-outline w-100 py-2 mt-2">
                            Cancelar
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
