<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .glow-card { background: #131b2e; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 20px; box-shadow: 0 0 35px rgba(239, 68, 68, 0.15); }
        .btn-glow-outline { background: transparent; color: #cbd5e1; border: 1px solid #334155; }
        .btn-glow-outline:hover { background: rgba(255, 255, 255, 0.05); color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 text-center">
                <div class="glow-card p-4 p-md-5">
                    
                    <div class="fs-1 text-danger mb-3">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>

                    <h1 class="h4 fw-bold text-white mb-3">Confirmar Eliminación</h1>
                    
                    <p class="text-white-50 fs-6 mb-4">
                        ¿Está seguro de que desea eliminar al empleado <strong class="text-white">{{ empleado.nombre }} {{ empleado.apellido }}</strong> (RUT: {{ empleado.rut }})?
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'lista_empleados' %}" class="btn btn-glow-outline px-4">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash-fill me-1"></i> Eliminar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
