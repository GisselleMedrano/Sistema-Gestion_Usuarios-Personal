<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .glow-card { background: #131b2e; border: 1px solid rgba(99, 102, 241, 0.25); border-radius: 20px; box-shadow: 0 0 35px rgba(79, 70, 229, 0.15); }
        .btn-glow-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; font-weight: 500; }
        .btn-glow-primary:hover { opacity: 0.9; color: white; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
        .btn-glow-outline { background: transparent; color: #cbd5e1; border: 1px solid #334155; }
        .btn-glow-outline:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #818cf8; font-weight: 600; margin-bottom: 0.3rem; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="glow-card p-4 p-md-5">
                    
                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                        <h1 class="h4 mb-0 fw-bold text-white">
                            <i class="bi bi-pencil-square me-2" style="color: #818cf8;"></i> {{ action }} Empleado
                        </h1>
                        <a href="{% url 'lista_empleados' %}" class="btn btn-glow-outline btn-sm px-3">
                            <i class="bi bi-x-lg me-1"></i> Cancelar
                        </a>
                    </div>

                    <form method="POST" novalidate>
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label>RUT</label>
                                {{ form.rut }}
                            </div>
                            <div class="col-md-6">
                                <label>Estado</label>
                                {{ form.estado }}
                            </div>
                            <div class="col-md-6">
                                <label>Nombre</label>
                                {{ form.nombre }}
                            </div>
                            <div class="col-md-6">
                                <label>Apellido</label>
                                {{ form.apellido }}
                            </div>
                            <div class="col-md-6">
                                <label>Correo Electrónico</label>
                                {{ form.email }}
                            </div>
                            <div class="col-md-6">
                                <label>Teléfono</label>
                                {{ form.telefono }}
                            </div>
                            <div class="col-md-6">
                                <label>Cargo</label>
                                {{ form.cargo }}
                            </div>
                            <div class="col-md-6">
                                <label>Departamento</label>
                                {{ form.departamento }}
                            </div>
                            <div class="col-12">
                                <label>Fecha de Ingreso</label>
                                {{ form.fecha_ingreso }}
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-end">
                            <button type="submit" class="btn btn-glow-primary px-4 py-2">
                                <i class="bi bi-floppy me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
